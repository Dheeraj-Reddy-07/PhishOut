<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 320px;
            background: #050508;
            color: #e0e0e0;
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            font-size: 12px;
            overflow: hidden;
        }

        /* Scanline effect */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(255,0,60,0.02) 2px, rgba(255,0,60,0.02) 4px
            );
            pointer-events: none; z-index: 100;
        }

        .header {
            background: linear-gradient(135deg, rgba(255,0,60,0.12), rgba(30,0,10,0.8));
            border-bottom: 1px solid rgba(255,0,60,0.3);
            padding: 14px 16px 12px;
            display: flex; align-items: center; gap: 10px;
        }

        .logo-icon { font-size: 1.4rem; }

        .logo-text {
            flex: 1;
        }

        .logo-text h1 {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ff003c;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,0,60,0.5);
        }

        .logo-text .version {
            font-size: 0.6rem;
            color: rgba(255,0,60,0.4);
            letter-spacing: 2px;
        }

        /* Backend status pill */
        .status-pill {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 10px;
            border-radius: 2px;
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid;
        }

        .status-pill.online {
            background: rgba(0,255,100,0.08);
            border-color: rgba(0,255,100,0.3);
            color: #00ff64;
        }

        .status-pill.offline {
            background: rgba(255,0,60,0.08);
            border-color: rgba(255,0,60,0.3);
            color: #ff003c;
        }

        .status-pill.checking {
            background: rgba(255,200,0,0.08);
            border-color: rgba(255,200,0,0.3);
            color: #ffc800;
        }

        .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: currentColor;
            animation: blink 1.2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .section {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .section-label {
            font-size: 0.55rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255,0,60,0.5);
            margin-bottom: 10px;
        }

        /* Last scan card */
        .scan-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            padding: 12px;
        }

        .scan-verdict {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 6px;
        }

        .scan-verdict.SAFE { color: #00ff64; text-shadow: 0 0 10px rgba(0,255,100,0.4); }
        .scan-verdict.SUSPICIOUS { color: #ffc800; text-shadow: 0 0 10px rgba(255,200,0,0.4); }
        .scan-verdict.PHISHING { color: #ff003c; text-shadow: 0 0 10px rgba(255,0,60,0.4); }

        .scan-url {
            font-size: 0.62rem;
            color: rgba(255,255,255,0.35);
            word-break: break-all;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .threat-bar-wrap {
            background: rgba(255,255,255,0.05);
            height: 4px;
            margin-bottom: 4px;
            overflow: hidden;
        }

        .threat-bar {
            height: 100%;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 8px currentColor;
        }

        .threat-bar.low   { background: #00ff64; }
        .threat-bar.mid   { background: #ffc800; }
        .threat-bar.high  { background: #ff003c; }

        .threat-pct {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.4);
            text-align: right;
        }

        .no-scan {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.25);
            text-align: center;
            padding: 12px 0;
            line-height: 1.8;
        }

        /* ML info */
        .ml-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .ml-row:last-child { border-bottom: none; }
        .ml-key { color: rgba(255,255,255,0.35); font-size: 0.65rem; }
        .ml-val { color: rgba(255,255,255,0.8); font-size: 0.65rem; }
        .ml-val.good { color: #00ff64; }
        .ml-val.bad  { color: #ff003c; }

        /* Footer */
        .footer {
            padding: 10px 16px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .footer-text {
            font-size: 0.55rem;
            color: rgba(255,0,60,0.25);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .open-dash-btn {
            background: rgba(255,0,60,0.1);
            border: 1px solid rgba(255,0,60,0.3);
            color: rgba(255,0,60,0.7);
            padding: 4px 10px;
            font-family: inherit;
            font-size: 0.6rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .open-dash-btn:hover {
            background: rgba(255,0,60,0.2);
            color: #ff003c;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-icon">🛡</div>
        <div class="logo-text">
            <h1>PhishGuard</h1>
            <div class="version">v3.0 · THREAT INTEL ENGINE</div>
        </div>
        <div class="status-pill checking" id="status-pill">
            <div class="dot"></div>
            <span id="status-text">CHECKING</span>
        </div>
    </div>

    <div class="section">
        <div class="section-label">Last Scan Result</div>
        <div id="scan-display">
            <div class="no-scan">
                No scan yet.<br>
                Visit a page with a login form<br>to activate threat detection.
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-label">Engine Status</div>
        <div class="ml-row">
            <span class="ml-key">Backend API</span>
            <span class="ml-val" id="api-status">—</span>
        </div>
        <div class="ml-row">
            <span class="ml-key">ML Model</span>
            <span class="ml-val" id="ml-status">—</span>
        </div>
        <div class="ml-row">
            <span class="ml-key">Engine</span>
            <span class="ml-val good">GradientBoost + RF</span>
        </div>
        <div class="ml-row">
            <span class="ml-key">Features</span>
            <span class="ml-val good">32 Engineered</span>
        </div>
    </div>

    <div class="footer">
        <span class="footer-text">Real-time ML protection</span>
        <button class="open-dash-btn" id="open-dash">Open Dashboard</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
